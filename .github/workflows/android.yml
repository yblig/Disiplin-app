name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Disiplin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Disiplin-apk
          path: Disiplin.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Disiplin APK (terbaru)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Disiplin.apk
          body: |
            Download **Disiplin.apk** di bawah, buka di HP Android, lalu izinkan "Instal dari sumber tidak dikenal".
            Build #${{ github.run_number }} dari commit ${{ github.sha }}.
